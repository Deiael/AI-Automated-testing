name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          python -m pip install -U pip
          pip install -e ./packages/contracts
          pip install -r ./engine/requirements.txt
          pip install -r ./gateway/requirements.txt
      - name: Import smoke
        run: |
          python -c "from ai_test_contracts import EngineRequest, EngineEvent; print('contracts ok')"
          cd engine && python -c "from app.config import settings; print('engine', settings.openai_model)"
          cd ../gateway && python -c "from app.config import settings; print('gateway ok')"
