[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-test-contracts"
version = "0.1.0"
description = "Shared EngineRequest / EngineEvent contracts"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[tool.setuptools.packages.find]
include = ["ai_test_contracts*"]
